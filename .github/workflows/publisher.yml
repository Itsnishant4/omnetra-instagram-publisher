name: Omnetra Scheduled Post Publisher

on:
  schedule:
    # Autonomous cloud check every 5 minutes (Runs 24/7 on GitHub servers, Mac can be OFF)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run reason'
        required: false
        default: 'Manual check triggered'

# Grant permissions to commit and push changes back to the repository
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run Queue Publisher
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          X02_API_KEY: ${{ secrets.X02_API_KEY }}
        run: |
          python publish_queue.py

      - name: Commit and Push Queue Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/ published/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-published scheduled posts and updated queue [skip ci]"
            git push origin main
          else
            echo "No queue changes to commit."
          fi
