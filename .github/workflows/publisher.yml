name: Omnetra Scheduled Post Publisher

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Pinpoint trigger from cron-job.org or manual dispatch'
        required: false
        default: 'Scheduled post trigger'

# Prevent concurrent runs: only ONE workflow can execute at any time
concurrency:
  group: instagram-publisher-queue
  cancel-in-progress: false

# Grant permissions to commit and push changes back to the repository
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run Queue Publisher
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN_OMNETRA: ${{ secrets.META_ACCESS_TOKEN_OMNETRA }}
          IG_USER_ID_OMNETRA: ${{ secrets.IG_USER_ID_OMNETRA }}
          META_ACCESS_TOKEN_VIDLINKS: ${{ secrets.META_ACCESS_TOKEN_VIDLINKS }}
          IG_USER_ID_VIDLINKS: ${{ secrets.IG_USER_ID_VIDLINKS }}
          X02_API_KEY: ${{ secrets.X02_API_KEY }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          FLIQ_API_KEY: ${{ secrets.FLIQ_API_KEY }}
        run: |
          python publish_queue.py

      - name: Commit and Push Queue Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/ published/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-published scheduled posts and updated queue [skip ci]"
            git push origin main
          else
            echo "No queue changes to commit."
          fi
